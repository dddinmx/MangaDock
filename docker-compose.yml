services:
  mangadock:
    build: .
    image: ${MANGADOCK_IMAGE:-dddinmx/mangadock:2.11.31}
    container_name: MangaDock
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANGADOCK_PORT:-5001}:5001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Optional: override the default initial admin password (mangadock) before first boot.
      MANGADOCK_ADMIN_PASSWORD: ${MANGADOCK_ADMIN_PASSWORD:-}
    volumes:
      - ./data/comic:/app/comic
      - ./data/novels:/app/小说
      - ./data/comic.json:/app/comic.json
      - mangadock_covers:/app/static/cover
      - mangadock_instance:/app/instance

volumes:
  mangadock_covers:
  mangadock_instance:
