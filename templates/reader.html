        // 加载章节列表
        async function loadChapters() {
            try {
                const response = await fetch(`/api/chapters/${encodeURIComponent(taskId)}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                chapters = data.chapters;

                if (chapters.length > 0) {
                    // 明确处理起始章节
                    if (startChapter >= 0 && startChapter < chapters.length) {
                        console.log('使用指定的起始章节:', startChapter);
                        currentChapter = startChapter;
                        // 尝试获取该章节的阅读进度，恢复滚动位置
                        try {
                            const progressResponse = await fetch(`/get_progress/${encodeURIComponent(comicName)}`);
                            const progressData = await progressResponse.json();

                            if (progressData.status === 'success' && progressData.chapter === currentChapter) {
                                console.log('恢复该章节的阅读进度:', progressData);
                                savedScrollPosition = progressData.scroll_position || 0;
                            } else {
                                savedScrollPosition = 0; // 新章节从顶部开始
                            }
                        } catch (err) {
                            console.error('获取阅读进度失败:', err);
                            savedScrollPosition = 0;
                        }
                    } else {
                        console.log('使用阅读进度');
                        // 只有在没有指定起始章节时才获取阅读进度
                        try {
                            const progressResponse = await fetch(`/get_progress/${encodeURIComponent(comicName)}`);
                            const progressData = await progressResponse.json();

                            if (progressData.status === 'success' && progressData.chapter !== undefined) {
                                console.log('阅读进度:', progressData);
                                currentChapter = Math.max(0, Math.min(progressData.chapter, chapters.length - 1));
                                savedScrollPosition = progressData.scroll_position || 0;
                            } else {
                                currentChapter = 0;
                                savedScrollPosition = 0;
                            }
                        } catch (err) {
                            console.error('获取阅读进度失败:', err);
                            currentChapter = 0;
                            savedScrollPosition = 0;
                        }
                    }

                    loadChapter(currentChapter, true);
                    populateChapterSelector();
                } else {
                    hideLoading();
                    showPageMessage('暂无章节内容');
                }
            } catch (error) {
                console.error('加载章节列表失败:', error);
                hideLoading();
                showPageMessage(`加载失败: ${error && error.message ? error.message : '未知错误'}`);
            }
        }
        
        // 加载指定章节
        async function loadChapter(chapterIndex, restoreScroll = true) {
            if (chapterIndex < 0 || chapterIndex >= chapters.length) {
                return;
            }

            const chapterLoadToken = ++activeChapterLoadToken;
            currentChapterReady = false;
            cbzImageQueue.clear();
            for (const container of document.querySelectorAll('.cbz-page[data-loading="true"]')) {
                container.cancelImageLoad?.();
            }
            continuousSections = [];
            continuousLoadPending = false;
            continuousLoadFailed = false;
            if (!restoreScroll) savedScrollPosition = 0;
            autoScrollChapterTransitionLocked = true;
            showLoading();
            pageContent.innerHTML = '';
            chapterNavButtons.innerHTML = '';

            currentChapter = chapterIndex;
            const chapter = chapters[chapterIndex];
            currentChapterFormat = chapter.format;
            const section = !isDesktopViewport() ? createChapterSection(chapterIndex) : null;
            if (section) {
                continuousSections.push(section);
                pageContent.appendChild(section.element);
            }
            const target = section ? section.element : pageContent;

            try {
                let chapterReady = true;
                if (chapter.format === 'pdf') {
                    await loadPdfChapter(chapter, chapterLoadToken, target);
                } else if (chapter.format === 'cbz') {
                    chapterReady = await loadCbzChapter(chapter, chapterLoadToken, target);
                }

                if (chapterLoadToken !== activeChapterLoadToken) {
                    return;
                }
                if (section) {
                    section.ready = chapterReady !== false;
                    if (chapter.format === 'pdf') section.loadedLastPage = currentChapterReady;
                }

                updateChapterInfo();
                updateChapterSelector();
                renderChapterNavButtons();
                syncReaderMode();
                setComicMargin(currentMargin);
                queueProgressUiSync();
                prefetchNextCbzChapter(currentChapter);

                if (restoreScroll && savedScrollPosition > 0) {
                    restoreSavedScrollPosition(chapterLoadToken, chapter.format === 'cbz' || currentChapterReady);
                } else {
                    window.scrollTo(0, 0);
                    queueProgressUiSync();
                }
                if (chapter.format === 'cbz') {
                    queueCbzChapterImages(target);
                }

                if (isAutoScrolling) {
                    autoScrollLastFrameTime = null;
                    autoScrollQueueResumeAt = performance.now() + 1500;
                }
                autoScrollQueuedChapterChange = false;
                autoScrollChapterTransitionLocked = false;
                queueProgressUiSync();
            } catch (error) {
                if (chapterLoadToken !== activeChapterLoadToken) return;
                autoScrollQueuedChapterChange = false;
                autoScrollChapterTransitionLocked = false;
                console.error('加载章节失败:', error);
                hideLoading();
                showPageMessage(`加载章节失败: ${error && error.message ? error.message : '未知错误'}`);
                showChapterRetry(pageContent, chapterLoadToken);
            }
        }

        function showPageMessage(text) {
            const wrap = document.createElement('div');
            wrap.className = 'flex items-center justify-center h-screen text-white';
            const p = document.createElement('p');
            p.textContent = text;
            wrap.appendChild(p);
            pageContent.replaceChildren(wrap);
        }

        function showChapterRetry(target, chapterLoadToken) {
            if (chapterLoadToken !== activeChapterLoadToken) return;
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'bottom-loading';
            retry.textContent = '图片加载中断，点击重试';
            retry.addEventListener('click', () => {
                savedScrollPosition = Math.max(window.scrollY - getChapterScrollBounds().start, 0);
                loadChapter(currentChapter, true);
            });
            target.appendChild(retry);
        }

        function waitForReaderVisible() {
            if (!document.hidden) return Promise.resolve();
            return new Promise((resolve) => {
                const onVisible = () => {
                    if (document.hidden) return;
                    document.removeEventListener('visibilitychange', onVisible);
                    resolve();
                };
                document.addEventListener('visibilitychange', onVisible);
            });
        }

        const cbzImageQueue = new Set();
        let cbzImagesLoading = 0;
        const cbzImagesInFlight = new Set();

        function drainCbzImageQueue() {
            for (const page of cbzImageQueue) {
                if (!page.isConnected || page.dataset.loading === 'loaded') cbzImageQueue.delete(page);
            }
            if (document.hidden) return;
            const distance = (page) => {
                const rect = page.getBoundingClientRect();
                if (rect.bottom <= 0) return 1 - rect.bottom;
                if (rect.top >= window.innerHeight) {
                    const actual = rect.top - window.innerHeight + 1;
                    return page.dataset.prefetchNext === 'true' ? Math.min(actual, window.innerHeight * 2) : actual;
                }
                return 0;
            };
            while (cbzImagesLoading < 6 && cbzImageQueue.size) {
                const page = Array.from(cbzImageQueue).sort((a, b) => distance(a) - distance(b))[0];
                cbzImageQueue.delete(page);
                cbzImagesLoading++;
                cbzImagesInFlight.add(page);
                Promise.resolve(page.loadImage()).finally(() => {
                    cbzImagesLoading--;
                    cbzImagesInFlight.delete(page);
                    drainCbzImageQueue();
                });
            }
        }

        function prioritizeVisibleCbzImages() {
            if (document.hidden || cbzImagesLoading < 6) return;
            const visible = Array.from(cbzImageQueue).some(page => {
                const rect = page.getBoundingClientRect();
                return rect.bottom > 0 && rect.top < window.innerHeight;
            });
            if (!visible) return;
            const distant = Array.from(cbzImagesInFlight).filter(page => {
                const rect = page.getBoundingClientRect();
                return rect.bottom < -window.innerHeight || rect.top > window.innerHeight * 2;
            }).sort((a, b) => Math.abs(b.getBoundingClientRect().top) - Math.abs(a.getBoundingClientRect().top))[0];
            distant?.cancelImageLoad?.(true);
        }

        window.addEventListener('scroll', prioritizeVisibleCbzImages, { passive: true });

        function queueCbzImage(container) {
            if (!container.isConnected || ['true', 'loaded'].includes(container.dataset.loading)) return;
            cbzImageQueue.add(container);
            prioritizeVisibleCbzImages();
            drainCbzImageQueue();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) drainCbzImageQueue();
        });

        function queueCbzChapterImages(target) {
            for (const container of target.querySelectorAll('.cbz-page')) {
                if (!['true', 'loaded'].includes(container.dataset.loading)) cbzImageQueue.add(container);
            }
            drainCbzImageQueue();
        }

        function buildCbzPageContainer(cacheEntry, pageIndex, pageCount, chapterLoadToken, target) {
            const [rawWidth, rawHeight] = cacheEntry.dimensions[pageIndex] || [];
            const width = Number(rawWidth) > 0 ? Number(rawWidth) : 720;
            const height = Number(rawHeight) > 0 ? Number(rawHeight) : 1000;
            const container = document.createElement('div');
            container.style.overflowAnchor = 'none';
            container.className = `page-container cbz-page margin-${currentMargin}`;
            const img = document.createElement('img');
            img.className = 'comic-page';
            img.width = width;
            img.height = height;
            img.alt = `第 ${pageIndex + 1} 页`;
            img.style.visibility = 'hidden';
            container.appendChild(img);
            const sizer = document.createElement('div');
            sizer.className = 'cbz-page-sizer';
            sizer.setAttribute('aria-hidden', 'true');
            const applyPageRatio = (ratioWidth, ratioHeight) => {
                const boxWidth = Number(ratioWidth) > 0 ? Number(ratioWidth) : 720;
                const boxHeight = Number(ratioHeight) > 0 ? Number(ratioHeight) : 1000;
                sizer.style.paddingTop = `${(boxHeight / boxWidth) * 100}%`;
            };
            applyPageRatio(width, height);
            const url = `${cacheEntry.pagesUrl}?page=${pageIndex}`;
            let attempts = 0;
            const status = document.createElement('button');
            status.type = 'button';
            status.className = 'cbz-page-retry';
            status.textContent = `第 ${pageIndex + 1} 页等待加载`;
            status.addEventListener('click', () => {
                container.cancelImageLoad?.();
                attempts = 0;
                queueCbzImage(container);
            });
            container.appendChild(status);
            container.appendChild(sizer);
            container.retryIfInterrupted = () => {
                if (container.dataset.loading === 'true' && img.complete && !img.naturalWidth) img.onerror?.();
            };
            container.loadImage = async () => {
                if (chapterLoadToken !== activeChapterLoadToken || !container.isConnected || ['true', 'loaded'].includes(container.dataset.loading)) return;
                await waitForReaderVisible();
                if (chapterLoadToken !== activeChapterLoadToken || !container.isConnected) return;
                attempts++;
                container.dataset.loading = 'true';
                status.textContent = `第 ${pageIndex + 1} 页加载中，点击重试`;
                await new Promise((resolve) => {
                    let settled = false;
                    const timeout = window.setTimeout(() => {
                        img.onerror?.();
                        img.removeAttribute('src');
                    }, 45000);
                    const finish = () => {
                        if (settled) return false;
                        settled = true;
                        window.clearTimeout(timeout);
                        img.onload = img.onerror = null;
                        resolve();
                        return true;
                    };
                    container.cancelImageLoad = (requeue = false) => {
                        if (!finish()) return;
                        container.dataset.loading = 'error';
                        img.removeAttribute('src');
                        if (requeue) {
                            attempts--;
                            cbzImageQueue.add(container);
                        }
                    };
                    img.onload = () => {
                        if (!finish()) return;
                        if (chapterLoadToken !== activeChapterLoadToken || !container.isConnected) return;
                        container.dataset.loading = 'loaded';
                        status.remove();
                        const anchor = Array.from(document.querySelectorAll('.cbz-page')).find(page => {
                            const rect = page.getBoundingClientRect();
                            return rect.bottom > 0 && rect.top < window.innerHeight;
                        });
                        const anchorTop = anchor?.getBoundingClientRect().top;
                        if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                            cacheEntry.dimensions[pageIndex] = [img.naturalWidth, img.naturalHeight];
                            img.width = img.naturalWidth;
                            img.height = img.naturalHeight;
                            applyPageRatio(img.naturalWidth, img.naturalHeight);
                        }
                        if (anchor && anchor !== container && !isDraggingProgressSlider) {
                            const shift = anchor.getBoundingClientRect().top - anchorTop;
                            if (Math.abs(shift) > 0.5) window.scrollBy(0, shift);
                        }
                        img.style.visibility = 'visible';
                        container.style.background = 'transparent';
                        const section = continuousSections.find(item => item.element === target);
                        if (section && !section.hasLoadedPage) {
                            section.hasLoadedPage = true;
                            queueProgressUiSync();
                        }
                        if (pageIndex === pageCount - 1) {
                            if (section) {
                                section.loadedLastPage = true;
                                completePassedChapter(section);
                            }
                            if (target === pageContent || section?.index === currentChapter) {
                                currentChapterReady = true;
                                queueProgressUiSync();
                            }
                        }
                    };
                    img.onerror = () => {
                        if (!finish()) return;
                        container.dataset.loading = 'error';
                        if (chapterLoadToken !== activeChapterLoadToken || !container.isConnected) return;
                        status.textContent = `第 ${pageIndex + 1} 页加载失败，点击重试`;
                        if (attempts < 3) {
                            window.setTimeout(() => queueCbzImage(container), 600 * attempts);
                            return;
                        }

                    };
                    img.src = `${url}${attempts > 1 ? `&retry=${Date.now()}` : ''}`;
                });
            };
            return container;
        }
        
        // 加载PDF章节
        async function loadPdfChapter(chapter, chapterLoadToken, target = pageContent, background = false) {
            const pdfUrl = `/static/comic/${encodeURIComponent(comicName)}/${encodeURIComponent(chapter.filename)}`;
            pdfjsLib.GlobalWorkerOptions.workerSrc = {{ asset_url('js/vendor/pdf.worker.min.js')|tojson }};

            try {
                const pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                if (chapterLoadToken !== activeChapterLoadToken) { await pdfDoc.destroy(); return; }
                if (!background) currentChapterData = pdfDoc;

                const isDesktop = isDesktopViewport();
                const widthRatio = (100 - currentMargin) / 100;
                const targetCssWidth = Math.max(
                    320,
                    Math.floor(window.innerWidth * widthRatio * (isDesktop ? 0.8 : 1))
                );
                const pixelRatio = window.devicePixelRatio || 1;
                const qualityBoost = isDesktop ? 1.5 : 1.25;

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    if (chapterLoadToken !== activeChapterLoadToken) break;
                    const page = await pdfDoc.getPage(pageNum);
                    const baseViewport = page.getViewport({ scale: 1 });
                    const cssScale = targetCssWidth / baseViewport.width;
                    const cssViewport = page.getViewport({ scale: cssScale });
                    const targetRenderWidth = Math.min(
                        Math.round(cssViewport.width * pixelRatio * qualityBoost),
                        2400
                    );
                    const renderScale = targetRenderWidth / baseViewport.width;
                    const renderViewport = page.getViewport({ scale: renderScale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = renderViewport.height;
                    canvas.width = renderViewport.width;
                    canvas.style.width = `${cssViewport.width}px`;
                    canvas.style.height = 'auto';
                    canvas.className = 'pdf-page';

                    await page.render({
                        canvasContext: context,
                        viewport: renderViewport
                    }).promise;
                    if (chapterLoadToken !== activeChapterLoadToken) break;

                    const pageContainer = document.createElement('div');
                    pageContainer.className = `page-container margin-${currentMargin}`;
                    pageContainer.appendChild(canvas);
                    target.appendChild(pageContainer);
                    queueProgressUiSync();

                    if (pageNum === 1) {
                        if (!background) hideLoading();
                    }
                }

                await pdfDoc.destroy();
                const section = continuousSections.find(item => item.element === target);
                if (section && chapterLoadToken === activeChapterLoadToken) {
                    section.loadedLastPage = true;
                    completePassedChapter(section);
                }
                if (!background && chapterLoadToken === activeChapterLoadToken) {
                    currentChapterReady = true;
                    queueProgressUiSync();
                }
            } catch (error) {
                console.error('PDF加载失败:', error);
                throw error;
            }
        }
        
        // 加载CBZ章节
        async function loadCbzChapter(chapter, chapterLoadToken, target = pageContent, background = false) {
            const cacheEntry = await ensureCbzChapterCache(chapter);
            if (chapterLoadToken !== activeChapterLoadToken) return;
            const imageFiles = cacheEntry.images;

            if (!background) currentChapterData = {
                images: imageFiles
            };

            if (imageFiles.length === 0) {
                throw new Error('章节中没有可阅读的图片');
            }

            const fragment = document.createDocumentFragment();
            imageFiles.forEach((pageIndex) => {
                const container = buildCbzPageContainer(cacheEntry, pageIndex, imageFiles.length, chapterLoadToken, target);
                if (background && pageIndex < 2) container.dataset.prefetchNext = 'true';
                fragment.appendChild(container);
            });
            target.appendChild(fragment);
            if (background) {
                queueCbzChapterImages(target);
            }
            if (!background) hideLoading();
            queueProgressUiSync();
            return true;
        }
        
        // 渲染章节导航按钮
        function renderChapterNavButtons() {
            chapterNavButtons.innerHTML = '';
            
            const prevBtn = document.createElement('button');
            prevBtn.className = 'chapter-nav-btn';
            prevBtn.innerHTML = '&lsaquo;';
            prevBtn.setAttribute('aria-label', '上一章');
            prevBtn.title = '上一章';
            if (currentChapter === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.addEventListener('click', goToPrevChapter);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'chapter-nav-btn';
            nextBtn.innerHTML = '&rsaquo;';
            nextBtn.setAttribute('aria-label', '下一章');
            nextBtn.title = '下一章';
            if (currentChapter === chapters.length - 1) {
                nextBtn.disabled = true;
            } else {
                nextBtn.addEventListener('click', goToNextChapter);
            }

            chapterNavButtons.appendChild(prevBtn);
            chapterNavButtons.appendChild(nextBtn);
        }
        
        // 上一章
        function goToPrevChapter() {
            if (currentChapter > 0) {
                savedScrollPosition = 0; // 切换章节时不恢复滚动位置
                loadChapter(currentChapter - 1, false);
            }
        }

        // 下一章
        function goToNextChapter() {
            if (currentChapter < chapters.length - 1) {
                completeCurrentChapterAtEnd();
                savedScrollPosition = 0; // 切换章节时不恢复滚动位置
                loadChapter(currentChapter + 1, false);
            }
        }

        function reportCompletedChapter(chapterIndex, manual = false) {
            if (!anilistEnabled) return;
            return fetch("{{ url_for('anilist_complete') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                credentials: 'include',
                body: JSON.stringify({ comic_name: comicName, chapter_index: chapterIndex })
            }).then(async response => {
                if (!response.ok) throw new Error((await response.json()).error || 'AniList 同步失败');
                if (manual) alert('本章已同步至 AniList');
            }).catch(error => {
                if (!manual) autoSyncedChapters.delete(chapterIndex);
                console.error('AniList 同步失败:', error);
                if (manual) alert(error.message);
            });
        }
        
        // 更新章节信息
        function updateChapterInfo() {
            const chapter = chapters[currentChapter];
            headerChapter.textContent = chapter ? chapter.title : `第 ${currentChapter + 1} 章`;
            readingProgressCurrentChapter.textContent = chapter ? chapter.title : '';
            const nextChapter = chapters[currentChapter + 1];
            readingProgressNextChapter.textContent = nextChapter ? nextChapter.title : '完';
            progressPrevBtn.disabled = currentChapter <= 0;
            progressNextBtn.disabled = currentChapter >= chapters.length - 1;
        }
        
        // 填充章节选择器
        function populateChapterSelector() {
            chapterSelect.innerHTML = '';
            chapters.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = chapter.title;
                if (index === currentChapter) {
                    option.selected = true;
                }
                chapterSelect.appendChild(option);
            });
        }
        
        // 更新章节选择器
        function updateChapterSelector() {
            chapterSelect.value = currentChapter;
        }
        
        // 切换章节选择器
        function toggleChapterSelector() {
            const opening = chapterSelector.style.display === 'none';
            chapterSelector.style.display = opening ? 'block' : 'none';
            chapterSelectorBtn.setAttribute('aria-expanded', String(opening));
            if (opening) updateChapterSelector();
        }
        
        // 隐藏章节选择器
        function hideChapterSelector() {
            chapterSelector.style.display = 'none';
            chapterSelectorBtn.setAttribute('aria-expanded', 'false');
        }
        
        // 处理章节选择变更
        function handleChapterChange() {
            const selectedChapter = parseInt(chapterSelect.value);
            if (selectedChapter !== currentChapter && !isNaN(selectedChapter)) {
                savedScrollPosition = 0; // 手动选择章节时不恢复滚动位置
                loadChapter(selectedChapter, false);
                hideChapterSelector();
            }
        }
        
        // 切换自动滚动
        function toggleAutoScroll() {
            if (isAutoScrolling) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        }

        function getAutoScrollPixelsPerSecond() {
            return autoScrollSpeed * 3.125;
        }

        function autoScrollStep(timestamp) {
            if (!isAutoScrolling) {
                autoScrollRafId = null;
                autoScrollLastFrameTime = null;
                return;
            }

            if (autoScrollLastFrameTime === null) {
                autoScrollLastFrameTime = timestamp;
            }

            const deltaMs = Math.min(Math.max(timestamp - autoScrollLastFrameTime, 0), 40);
            autoScrollLastFrameTime = timestamp;
            const scrollAmount = autoScrollChapterTransitionLocked ? 0 : (getAutoScrollPixelsPerSecond() * (deltaMs / 1000));

            if (scrollAmount > 0) {
                window.scrollBy(0, scrollAmount);
            }

            if (!isDesktopViewport() && continuousSections.length) {
                syncContinuousReading();
                const tail = continuousSections[continuousSections.length - 1];
                if (tail.ready && tail.index === chapters.length - 1 && window.scrollY >= getMaxScrollTop() - 1) {
                    stopAutoScroll();
                    return;
                }
            } else if (!autoScrollChapterTransitionLocked && timestamp >= autoScrollQueueResumeAt && window.innerHeight + window.scrollY >= document.body.offsetHeight - 10) {
                if (currentChapter < chapters.length - 1) {
                    if (!autoScrollQueuedChapterChange) {
                        autoScrollQueuedChapterChange = true;
                        autoScrollChapterTransitionLocked = true;
                        setTimeout(() => {
                            if (!isAutoScrolling) {
                                autoScrollQueuedChapterChange = false;
                                autoScrollChapterTransitionLocked = false;
                                return;
                            }
                            goToNextChapter();
                        }, 1000);
                    }
                } else {
                    stopAutoScroll();
                    return;
                }
            }

            autoScrollRafId = window.requestAnimationFrame(autoScrollStep);
        }
        
        // 开始自动滚动
        function startAutoScroll() {
            isAutoScrolling = true;
            autoScrollQueuedChapterChange = false;
            autoScrollLastFrameTime = null;
            autoScrollBtn.innerHTML = '<i class="fa fa-pause"></i><span>暂停</span>';
            showAutoScrollSpeedControl();

            if (autoScrollRafId) {
                window.cancelAnimationFrame(autoScrollRafId);
            }
            autoScrollRafId = window.requestAnimationFrame(autoScrollStep);
        }
        
        // 停止自动滚动
        function stopAutoScroll() {
            isAutoScrolling = false;
            autoScrollQueuedChapterChange = false;
            autoScrollLastFrameTime = null;
            autoScrollBtn.innerHTML = '<i class="fa fa-arrow-down"></i><span>滚动</span>';
            hideAutoScrollSpeedControl();
            
            if (autoScrollRafId) {
                window.cancelAnimationFrame(autoScrollRafId);
                autoScrollRafId = null;
            }
        }

        function syncReaderMode() {
            const isPdf = currentChapterFormat === 'pdf';

            if (isPdf) {
                stopAutoScroll();
                autoScrollBtn.disabled = true;
                widthAdjustBtn.disabled = false;
                screenClickTrigger.style.display = 'none';
                showToolbars();
                return;
            }

            autoScrollBtn.disabled = false;
            screenClickTrigger.style.display = 'block';
        }

        function getMaxScrollTop() {
            const documentHeight = Math.max(
                document.body.scrollHeight,
                document.documentElement.scrollHeight
            );

            return Math.max(documentHeight - window.innerHeight, 0);
        }

        function getProgressPercent(scrollTop = window.scrollY) {
            const { start, end } = getChapterScrollBounds();
            const maxScrollTop = end - start;
            if (maxScrollTop <= 0) {
                return 0;
            }

            return Math.min(Math.max(((scrollTop - start) / maxScrollTop) * 100, 0), 100);
        }

        function updateProgressSliderTrack(percent) {
            readingProgressSlider.style.setProperty('--progress-fill', `${percent}%`);
        }

        function syncProgressUi(percent = getProgressPercent()) {
            const safePercent = Number.isFinite(percent) ? percent : 0;

            if (!isDraggingProgressSlider) {
                readingProgressSlider.value = String(Math.round((safePercent / 100) * 1000));
            }

            readingProgressValue.textContent = `${Math.round(safePercent)}%`;
            updateProgressSliderTrack(safePercent);
        }

        function queueProgressUiSync() {
            if (progressUiFrameId) {
                return;
            }

            progressUiFrameId = window.requestAnimationFrame(() => {
                progressUiFrameId = null;
                syncContinuousReading();
                syncProgressUi();
                if (!isDraggingProgressSlider && window.scrollY > 0) completeCurrentChapterAtEnd();
            });
        }

        function scrollToProgressValue(value) {
            const sliderValue = Number(value);
            const percent = Math.min(Math.max(sliderValue / 10, 0), 100);
            const { start, end } = getChapterScrollBounds();
            const targetScrollTop = Math.round(start + (percent / 100) * (end - start));
            window.scrollTo(0, targetScrollTop);
            syncProgressUi(percent);
        }

        function handleProgressSliderInput(event) {
            isDraggingProgressSlider = true;
            scrollToProgressValue(event.target.value);
        }

        function startProgressSliderDrag() {
            isDraggingProgressSlider = true;
        }

        function stopProgressSliderDrag() {
            isDraggingProgressSlider = false;
            queueProgressUiSync();
        }

        function finishProgressSliderDrag() {
            stopProgressSliderDrag();
            scrollToProgressValue(readingProgressSlider.value);
            saveProgress();
        }

        function restoreSavedScrollPosition(token = activeChapterLoadToken, complete = false) {
            if (token !== activeChapterLoadToken || savedScrollPosition <= 0) return;
            const targetScrollTop = savedScrollPosition;
            const maxScrollTop = getMaxScrollTop();
            const clampedScrollTop = Math.min(targetScrollTop, maxScrollTop);

            window.scrollTo(0, clampedScrollTop);
            queueProgressUiSync();

            if (maxScrollTop >= targetScrollTop || complete) savedScrollPosition = 0;
        }
        
        function startReadingTimer() {
            if (document.hidden) {
                return;
            }
            if (visibleReadingStartedAt === null) {
                visibleReadingStartedAt = Date.now();
            }
        }

        function flushVisibleReadingTime() {
            if (visibleReadingStartedAt !== null) {
                accumulatedReadingMs += Math.max(Date.now() - visibleReadingStartedAt, 0);
                visibleReadingStartedAt = null;
            }
        }

        function getAccumulatedReadingSeconds() {
            flushVisibleReadingTime();
            return Math.floor(accumulatedReadingMs / 1000);
        }

        function buildProgressPayload(includeReadingTime = false) {
            const readingSeconds = includeReadingTime ? getAccumulatedReadingSeconds() : 0;
            return JSON.stringify({
                comic_name: comicName,
                chapter: currentChapter,
                page: 0,
                scroll_position: Math.round(savedScrollPosition || Math.max(window.scrollY - getChapterScrollBounds().start, 0)),
                total_chapters: chapters.length,
                total_pages: 0,
                reading_time: readingSeconds,
                reading_session_id: readingSessionId,
                client_progress_ms: nextProgressMs()
            });
        }

        function postProgress(saveData, keepalive = false) {
            return fetch("{{ url_for('save_progress') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                credentials: 'include', // 确保携带认证信息
                body: saveData,
                keepalive
            });
        }

        function submitProgressSnapshot({ keepalive = false, includeReadingTime = false } = {}) {
            if (chapters.length === 0) return;

            const readingSeconds = includeReadingTime ? getAccumulatedReadingSeconds() : 0;
            if (includeReadingTime && readingSeconds > 0) {
                const previousReportedSeconds = reportedReadingSeconds;
                reportedReadingSeconds = Math.max(reportedReadingSeconds, readingSeconds);
                const saveData = buildProgressPayload(true);
                postProgress(saveData, keepalive).catch(err => {
                    if (!keepalive) {
                        reportedReadingSeconds = previousReportedSeconds;
                    }
                    console.error('保存阅读状态失败:', err);
                });
                return;
            }

            const saveData = buildProgressPayload(false);
            postProgress(saveData, keepalive).then(response => {
                console.log('保存进度响应:', response.status);
            }).catch(err => {
                console.error('保存进度失败:', err);
            });
        }

        // 保存进度
        function saveProgress(keepalive = false) {
            submitProgressSnapshot({ keepalive, includeReadingTime: false });
        }

        // 显示加载遮罩
        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }

        // 隐藏加载遮罩
        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        syncProgressUi(0);
        syncAutoScrollSpeedUi();

        // 页面关闭时保存进度与阅读时间
        window.addEventListener('beforeunload', () => {
            flushVisibleReadingTime();
            submitProgressSnapshot({ keepalive: true, includeReadingTime: true });
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                flushVisibleReadingTime();
                submitProgressSnapshot({ keepalive: true, includeReadingTime: true });
            } else {
                startReadingTimer();
                window.setTimeout(() => {
                    for (const container of document.querySelectorAll('.cbz-page[data-loading="true"]')) {
                        container.retryIfInterrupted?.();
                    }
                }, 800);
            }
        });

        window.addEventListener('pagehide', () => {
            flushVisibleReadingTime();
            submitProgressSnapshot({ keepalive: true, includeReadingTime: true });
        });

        window.addEventListener('load', startReadingTimer);
    </script>
</body>
</html>
