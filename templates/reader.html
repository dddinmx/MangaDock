    {# iOS 15.0–15.3 没有 structuredClone，pdf.js 假 worker 通道会直接抛错。 #}
    <script>
        if (typeof structuredClone !== 'function') {
            window.structuredClone = function (value) {
                if (value instanceof ArrayBuffer) return value.slice(0);
                if (ArrayBuffer.isView(value)) return new value.constructor(value);
                return JSON.parse(JSON.stringify(value));
            };
        }
    </script>
    {# PDF 库延迟加载，避免阻塞首屏解析。 #}

    <style>

        /* 页面容器 */
        .page-container {

            justify-content: center;
            align-items: flex-start;
            margin: 0 !important;
            padding: 0 !important;

        .cbz-page {
            position: relative;
            background: #141414 !important;
        }

        /* iOS 15 Safari：父级靠 aspect-ratio、子图 absolute 时高度为 0，整章空白。
           用流式占位块撑开高度，padding-top% 相对本页宽度。 */
        .cbz-page-sizer {
            display: block;
            width: 100%;
            pointer-events: none;
            visibility: hidden;
        }

        .cbz-page .comic-page {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .cbz-page-retry {
            position: absolute;
            z-index: 51;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            background: #52657e;

        /* 加载遮罩 */

            top: 0;
            left: 0;
            width: 100%;

            background-color: rgba(0,0,0,0.8);

            justify-content: center;
            align-items: center;

        }

        /* 底部加载指示器 */
        .bottom-loading {

        /* 顶部标题栏 */

        .mobile-header.hidden {

        .mobile-header-chapter {

        /* 底部工具栏（移动端） */

            right: 0;

        /* 阅读进度条 */

        .reading-progress-slider {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;

        /* 工具栏按钮 */

        /* 宽度调节滑块 */
        .width-slider-container {

        .auto-scroll-speed-container {
            display: none;

            gap: 10px;

            width: auto;

        .auto-scroll-speed-label {

        .auto-scroll-speed-slider {
            width: 100%;

            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .auto-scroll-speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #d4d4d8;
            cursor: pointer;
            border: none;
            box-shadow: none;
        }

        .auto-scroll-speed-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #d4d4d8;
            cursor: pointer;
            border: none;
            box-shadow: none;
        }

        .width-slider-label {
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .width-slider {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .width-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #d4d4d8;
            cursor: pointer;
            border: none;
            box-shadow: none;
        }

        .width-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #d4d4d8;
            cursor: pointer;
            border: none;
            box-shadow: none;
        }
        
        /* 章节选择器（移动端优化） */
        .chapter-selector {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: calc(118px + max(8px, env(safe-area-inset-bottom, 0px)));
            transform: none;
            background: #19191f;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 16px;
            z-index: 102;
            color: #f4f4f6;
            color-scheme: dark;
            min-width: 0;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
        }

        .chapter-selector-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .chapter-selector-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .chapter-selector-title > i {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #e7e7ed;
            font-size: 16px;
        }

        .chapter-selector-title strong {
            display: block;
            font-size: 15px;
            line-height: 1.25;
        }

        .chapter-selector-title small {
            display: block;
            margin-top: 2px;
            color: #a0a0ae;
            font-size: 11px;
        }

        .chapter-selector-close {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border: 0;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.06);
            color: #d4d4dd;
            cursor: pointer;
        }

        .chapter-selector-close:hover,
        .chapter-selector-close:focus-visible {
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
        }

        .chapter-selector-field {
            position: relative;
        }

        .chapter-selector-field::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 16px;
            width: 8px;
            height: 8px;
            border-right: 2px solid #a0a0ae;
            border-bottom: 2px solid #a0a0ae;
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }
        
        .chapter-selector select {
            appearance: none;
            -webkit-appearance: none;
            background: #101016;
            color: #f4f4f6;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 10px;
            padding: 12px 38px 12px 14px;
            width: 100%;
            min-height: 46px;
            font-size: 14px;
            outline: none;
        }

        .chapter-selector select:focus-visible {
            border-color: #a5b4e2;
            box-shadow: 0 0 0 3px rgba(165, 180, 226, 0.16);
        }

        .chapter-selector select option {
            background: #19191f;
            color: #f4f4f6;
        }
        
        /* 返回按钮：按下立刻缩小+涟漪，跳转前保持转圈，避免弱网时以为没点上 */
        .back-btn {
            background-color: transparent;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            border-radius: 50%;
            text-decoration: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
        }

        .back-btn-ripple {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .back-btn-ripple::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 68%);
            transform: scale(0);
            opacity: 0;
        }

        .back-btn.is-pressed .back-btn-ripple::after {
            animation: reader-back-ripple 0.42s ease-out;
        }

        .back-btn-icon,
        .back-btn-spinner {
            position: relative;
            z-index: 1;
            font-size: 16px;
            line-height: 1;
        }

        .back-btn-spinner {
            display: none;
        }

        .back-btn:active,
        .back-btn.is-pressed {
            background-color: rgba(255,255,255,0.22);
            transform: scale(0.88);
        }

        .back-btn.is-leaving {
            background-color: rgba(255,255,255,0.16);
            transform: scale(1);
            pointer-events: none;
            animation: reader-back-pulse 1.1s ease-in-out infinite;
        }

        .back-btn.is-leaving .back-btn-icon {
            display: none;
        }

        .back-btn.is-leaving .back-btn-spinner {
            display: inline-block;
        }

        @keyframes reader-back-ripple {
            0% { transform: scale(0.15); opacity: 0.95; }
            100% { transform: scale(1.75); opacity: 0; }
        }

        @keyframes reader-back-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.28); }
            50% { box-shadow: 0 0 0 7px rgba(255,255,255,0.06); }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-btn,
            .back-btn:active,
            .back-btn.is-pressed,
            .back-btn.is-leaving {
                transition: background-color 0.16s ease;
                transform: none;
                animation: none;
            }

            .back-btn-ripple::after {
                animation: none !important;
                opacity: 0;
            }
        }
        
        /* 屏幕点击区域 */
        .screen-click-trigger {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 96px;
            z-index: 50;
            background: transparent;
        }

        @media (min-width: 769px) {
            .reader-container {
                padding-top: 0;
                padding-bottom: 0;
            }

            .mobile-header {

            .reading-progress {

            .width-slider-container {

            .auto-scroll-speed-container {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                bottom: 128px;
                min-width: 0;
                width: min(680px, calc(100vw - 48px));
                background: rgba(0, 0, 0, 0.96);
                border: 1px solid rgba(107, 114, 128, 0.45);
                border-radius: 20px;
                box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
                padding: 14px 16px;
                z-index: 103;
            }

            .chapter-selector {
                top: auto;
                left: 50%;
                right: auto;
                bottom: 128px;
                transform: translateX(-50%);
                border-radius: 16px;
                padding: 16px;
                min-width: 0;
                width: min(420px, calc(100vw - 48px));
            }

            .back-btn {
                position: fixed;
                top: 20px;
                left: 20px;

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            width: 0px;

        /* 章节导航按钮 */
        .chapter-nav-buttons {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 36px;
            padding: 26px 0 30px;
            background-color: #111;
            margin: 0 !important;
            position: relative;
            z-index: 60;
        }

        .chapter-nav-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.86);
            border: none;
            border-radius: 0;
            width: 42px;
            height: 42px;
            padding: 0;
            cursor: pointer;
            font-size: 26px;

</head>
<body>
    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center text-white">
            <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
            <p>加载中...</p>
        </div>
    </div>
    
    <!-- 移动端顶部标题栏 -->
    <div class="mobile-header" id="mobile-header">
        <div class="mobile-header-left">
            <a href="{{ url_for('comic_detail', task_id=task.id, return_to=library_return_url) }}" class="back-btn" aria-label="返回漫画详情">
                <span class="back-btn-ripple" aria-hidden="true"></span>
                <i class="fa fa-arrow-left back-btn-icon"></i>
                <i class="fa fa-spinner fa-spin back-btn-spinner" aria-hidden="true"></i>
            </a>
            <div>
                <div class="mobile-header-title">{{ task.comic_name }}</div>
                <div class="mobile-header-chapter" id="header-chapter">第 1 章</div>
            </div>
        </div>
    </div>
    
    <!-- 桌面端返回按钮 -->
    <a href="{{ url_for('comic_detail', task_id=task.id, return_to=library_return_url) }}" class="back-btn" style="display: none;" id="desktop-back-btn" aria-label="返回漫画详情">
        <span class="back-btn-ripple" aria-hidden="true"></span>
        <i class="fa fa-arrow-left back-btn-icon"></i>
        <i class="fa fa-spinner fa-spin back-btn-spinner" aria-hidden="true"></i>
    </a>

    <div class="reading-progress" id="reading-progress">
        <div class="reading-progress-layout">
            <button type="button" class="progress-nav-btn" id="progress-prev-btn" aria-label="上一章">
                <i class="fa fa-step-backward"></i>
            </button>
            <span class="reading-progress-chapter-side" id="reading-progress-current-chapter">1</span>
            <div class="reading-progress-main">
                <input
                    type="range"
                    min="0"
                    max="1000"
                    step="1"
                    value="0"
                    class="reading-progress-slider"
                    id="reading-progress-slider"
                    aria-label="阅读进度"
                >
                <div class="reading-progress-header">
                    <span class="reading-progress-label">阅读进度</span>
                    <span class="reading-progress-value" id="reading-progress-value">0%</span>
                </div>
            </div>
            <span class="reading-progress-chapter-side" id="reading-progress-next-chapter">2</span>
            <button type="button" class="progress-nav-btn" id="progress-next-btn" aria-label="下一章">

    </div>

    <!-- 底部工具栏 -->
    <div class="floating-controls{% if anilist_enabled %} with-anilist{% endif %}" id="floating-controls">
        <div class="reading-progress-host" id="reading-progress-mobile-slot"></div>
        <button id="chapter-selector-btn" class="control-btn" aria-label="章节列表" aria-controls="chapter-selector" aria-expanded="false">
            <i class="fa fa-list-ol" aria-hidden="true"></i>

        </button>
        <button id="auto-scroll-btn" class="control-btn" aria-label="自动滚动">

            <span>滚动</span>
        </button>
        {% if anilist_enabled %}
        <button id="anilist-complete-btn" class="control-btn" aria-label="标记本章已读并同步 AniList">
            <i class="fa fa-check"></i>
            <span>已读</span>

        {% endif %}
        <button id="width-adjust-btn" class="control-btn" aria-label="阅读设置">
            <i class="fa fa-cog"></i>
            <span>宽度</span>
        </button>
        <div class="auto-scroll-speed-container" id="auto-scroll-speed-container">
            <div class="auto-scroll-speed-label">
                <span>滚动速度</span>
                <span id="auto-scroll-speed-value">50</span>
            </div>
            <input type="range" min="10" max="120" step="5" value="50" class="auto-scroll-speed-slider" id="auto-scroll-speed-slider">
        </div>
        <div class="width-slider-container" id="width-slider-container">
            <div class="width-slider-label">
                <span>页面宽度</span>
                <span id="width-value">100%</span>
            </div>
            <input type="range" min="0" max="70" step="10" value="0" class="width-slider" id="width-slider">
        </div>
    </div>
    
    <!-- 章节选择器 -->
    <div id="chapter-selector" class="chapter-selector" style="display: none;">
        <div class="chapter-selector-heading">
            <div class="chapter-selector-title">
                <i class="fa fa-list-ol" aria-hidden="true"></i>
                <div><strong>选择章节</strong><small>跳转到指定章节</small></div>
            </div>
            <button type="button" class="chapter-selector-close" id="chapter-selector-close" aria-label="关闭章节选择">
                <i class="fa fa-times" aria-hidden="true"></i>
            </button>
        </div>
        <div class="chapter-selector-field">
            <select id="chapter-select" aria-label="选择章节"></select>
        </div>
    </div>

    <!-- 阅读容器 -->
    <div class="reader-container" id="reader-container">
        <div class="page-content" id="page-content"></div>
        <div class="chapter-nav-buttons" id="chapter-nav-buttons"></div>
    </div>

    <!-- 屏幕点击唤醒区域 -->
    <div class="screen-click-trigger" id="screenClickTrigger"></div>

    <script>
        // 全局变量
        const comicName = {{ task.comic_name|tojson }};
        const taskId = {{ task.id|tojson }};
        const startChapter = Number({{ (start_chapter if start_chapter is defined else 0)|tojson }}) || 0;
        const csrfToken = {{ csrf_token()|tojson }};
        const anilistEnabled = {{ anilist_enabled|tojson }};
        let currentChapter = startChapter;
        let chapters = [];
        let currentChapterData = null;
        let isAutoScrolling = false;
        let autoScrollRafId = null;
        let autoScrollLastFrameTime = null;
        let autoScrollSpeed = 50;
        const AUTO_SCROLL_SPEED_STORAGE_KEY = 'mangadock-reader-auto-scroll-speed';
        let autoScrollQueuedChapterChange = false;
        let autoScrollChapterTransitionLocked = false;
        let autoScrollQueueResumeAt = 0;
        let currentMargin = 0;
        let currentChapterFormat = null;
        let currentChapterReady = false;
        const autoSyncedChapters = new Set();
        let savedScrollPosition = 0; // 保存的滚动位置
        let scrollSaveTimer = null; // 滚动保存定时器
        let progressIntervalId = null;
        let isDraggingProgressSlider = false;
        let progressUiFrameId = null;
        let activeChapterLoadToken = 0;
        let continuousSections = [];
        let continuousLoadPending = false;
        let continuousLoadFailed = false;
        let readerDesktopViewport = isDesktopViewport();
        const chapterCache = new Map();
        const MAX_CHAPTER_CACHE_SIZE = 2;
        const readingSessionId = `${taskId}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        let visibleReadingStartedAt = null;
        let accumulatedReadingMs = 0;
        let reportedReadingSeconds = 0;
        let progressClockMs = 0;
        let readerBackLeaving = false;
        let readerBackPressTimer = null;
        function nextProgressMs() {
            const now = Date.now();
            progressClockMs = Math.max(progressClockMs + 1, now);
            return progressClockMs;
        }
        
        // DOM元素
        const pageContent = document.getElementById('page-content');
        const loadingOverlay = document.getElementById('loading-overlay');
        const readingProgress = document.getElementById('reading-progress');
        const readingProgressSlider = document.getElementById('reading-progress-slider');
        const readingProgressValue = document.getElementById('reading-progress-value');
        const progressPrevBtn = document.getElementById('progress-prev-btn');
        const progressNextBtn = document.getElementById('progress-next-btn');
        const readingProgressCurrentChapter = document.getElementById('reading-progress-current-chapter');
        const readingProgressNextChapter = document.getElementById('reading-progress-next-chapter');
        const chapterSelector = document.getElementById('chapter-selector');
        const chapterSelect = document.getElementById('chapter-select');
        const chapterSelectorBtn = document.getElementById('chapter-selector-btn');
        const autoScrollBtn = document.getElementById('auto-scroll-btn');
        const chapterNavButtons = document.getElementById('chapter-nav-buttons');
        const widthAdjustBtn = document.getElementById('width-adjust-btn');
        const autoScrollSpeedContainer = document.getElementById('auto-scroll-speed-container');
        const autoScrollSpeedSlider = document.getElementById('auto-scroll-speed-slider');
        const autoScrollSpeedValue = document.getElementById('auto-scroll-speed-value');
        const widthSliderContainer = document.getElementById('width-slider-container');
        const widthSlider = document.getElementById('width-slider');
        const widthValue = document.getElementById('width-value');
        const screenClickTrigger = document.getElementById('screenClickTrigger');
        const floatingControls = document.getElementById('floating-controls');
        const readingProgressMobileSlot = document.getElementById('reading-progress-mobile-slot');
        const mobileHeader = document.getElementById('mobile-header');
        const headerChapter = document.getElementById('header-chapter');
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            syncReadingProgressPlacement();
            restoreAutoScrollSpeed();
            currentMargin = getDefaultMarginForViewport();
            setComicMargin(currentMargin);
            loadChapters();
            bindAllEvents();
            if (anilistEnabled) {
                window.setInterval(async () => {
                    if (document.hidden || !chapters.length) return;
                    try {
                        const response = await fetch("{{ url_for('anilist_sync') }}", {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                            credentials: 'include',
                            body: JSON.stringify({ comic_name: comicName })
                        });
                        if (!response.ok) return;
                        // 同步已读进度，不改变本次阅读的位置（用户可能正在回看）。
                    } catch (error) {
                        console.error('AniList 双向同步失败:', error);
                    }
                }, 60000);
            }
            if (!progressIntervalId) {
                progressIntervalId = window.setInterval(() => saveProgress(), 30000);
            }
            detectDevice();

            // 监听滚动事件，延迟保存滚动位置
            window.addEventListener('scroll', () => {
                queueProgressUiSync();
                if (scrollSaveTimer) {
                    clearTimeout(scrollSaveTimer);
                }
                scrollSaveTimer = setTimeout(() => {
                    saveProgress();
                }, 1000); // 停止滚动1秒后保存
            });
        });
        
        // 检测设备类型
        function detectDevice() {
            const isDesktop = isDesktopViewport();
            if (isDesktop) {
                document.getElementById('desktop-back-btn').style.display = 'flex';
            } else {
                document.getElementById('desktop-back-btn').style.display = 'none';
            }
        }

        function isDesktopViewport() {
            return window.innerWidth > 768;
        }

        function getDefaultMarginForViewport() {
            return isDesktopViewport() ? 70 : 0;
        }

        function createChapterSection(index) {
            const element = document.createElement('section');
            element.dataset.chapter = String(index);
            return { index, element, ready: false, hasLoadedPage: false, loadedLastPage: false, passedEnd: false };
        }

        function completePassedChapter(section) {
            if (!section?.passedEnd || !section.loadedLastPage || autoSyncedChapters.has(section.index)) return;
            autoSyncedChapters.add(section.index);
            reportCompletedChapter(section.index);
        }

        function completeCurrentChapterAtEnd() {
            if (!anilistEnabled || !currentChapterReady || autoSyncedChapters.has(currentChapter)) return;
            const section = continuousSections.find(item => item.index === currentChapter);
            const content = section?.element || pageContent;
            if (content.getBoundingClientRect().bottom > window.innerHeight + 2) return;
            autoSyncedChapters.add(currentChapter);
            reportCompletedChapter(currentChapter);
        }

        // 以当前章节自己的坐标保存进度，重新打开时无需加载之前的章节。
        function getChapterScrollBounds() {
            const section = continuousSections.find(item => item.index === currentChapter);
            if (!section) return { start: 0, end: getMaxScrollTop() };
            const origin = pageContent.getBoundingClientRect().top + window.scrollY;
            const start = section.element.getBoundingClientRect().top + window.scrollY - origin;
            return { start, end: start + Math.max(section.element.offsetHeight + origin + 96 - window.innerHeight, 0) };
        }

        function syncContinuousReading() {
            if (isDesktopViewport() || !continuousSections.length || autoScrollChapterTransitionLocked || savedScrollPosition > 0) return;
            if (!isDraggingProgressSlider) {
                const origin = pageContent.getBoundingClientRect().top + window.scrollY;
                let visible = continuousSections[0];
                for (const item of continuousSections) {
                    if (item.element.getBoundingClientRect().top > origin + 1) break;
                    visible = item;
                }
                if (visible && visible.index !== currentChapter) {
                    if (visible.index === currentChapter + 1) {
                        const previous = continuousSections.find(item => item.index === currentChapter);
                        if (previous) {
                            previous.passedEnd = true;
                            completePassedChapter(previous);
                        }
                    }
                    currentChapter = visible.index;
                    currentChapterFormat = chapters[currentChapter].format;
                    currentChapterReady = visible.loadedLastPage;
                    updateChapterInfo();
                    updateChapterSelector();
                    renderChapterNavButtons();
                    syncReaderMode();
                }
            }
            const tail = continuousSections[continuousSections.length - 1];
            // CBZ 首张图片就绪后追加下一章；页面队列仍优先加载当前章附近的图片。
            // PDF 保持靠近章末时追加，避免后台同时渲染两份完整 PDF。
            if (tail.ready && tail.index <= currentChapter && tail.index < chapters.length - 1 &&
                (chapters[tail.index].format === 'cbz' ? tail.hasLoadedPage :
                    tail.element.getBoundingClientRect().bottom < window.innerHeight * 3)) {
                appendNextChapter();
            }
        }

        async function appendNextChapter() {
            if (continuousLoadPending || continuousLoadFailed || isDesktopViewport()) return;
            const tail = continuousSections[continuousSections.length - 1];
            if (!tail?.ready || tail.index >= chapters.length - 1) return;
            const token = activeChapterLoadToken;
            const section = createChapterSection(tail.index + 1);
            const chapter = chapters[section.index];
            continuousLoadPending = true;
            continuousSections.push(section);
            pageContent.appendChild(section.element);
            try {
                if (chapter.format === 'cbz') {
                    await loadCbzChapter(chapter, token, section.element, true);
                } else if (chapter.format === 'pdf') {
                    await loadPdfChapter(chapter, token, section.element, true);
                } else {
                    throw new Error('不支持的章节格式');
                }
                if (token !== activeChapterLoadToken) return;
                section.ready = true;
                prefetchNextCbzChapter(section.index);
            } catch (error) {
                if (token !== activeChapterLoadToken) return;
                continuousLoadFailed = true;
                section.element.replaceChildren();
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'bottom-loading';
                retry.textContent = '下一章加载失败，点击重试';
                retry.addEventListener('click', () => {
                    section.element.remove();
                    continuousSections.pop();
                    continuousLoadFailed = false;
                    appendNextChapter();
                });
                section.element.appendChild(retry);
                console.error('连续阅读加载失败:', error);
            } finally {
                if (token === activeChapterLoadToken) {
                    continuousLoadPending = false;
                    queueProgressUiSync();
                }
            }
        }

        function syncReadingProgressPlacement() {
            if (readingProgress.parentElement !== readingProgressMobileSlot) {
                readingProgressMobileSlot.appendChild(readingProgress);
            }
        }

        function getChapterCacheKey(chapter) {
            return chapter ? `${chapter.format}:${chapter.filename}` : '';
        }

        function scheduleIdleTask(callback) {
            if ('requestIdleCallback' in window) {
                return window.requestIdleCallback(callback, { timeout: 1200 });
            }
            return window.setTimeout(callback, 180);
        }

        function pruneChapterCache(retainedKeys = []) {
            const keepKeys = new Set((retainedKeys || []).filter(Boolean));
            for (const cacheKey of Array.from(chapterCache.keys())) {
                if (!keepKeys.has(cacheKey)) {
                    chapterCache.delete(cacheKey);
                }
            }

            while (chapterCache.size > MAX_CHAPTER_CACHE_SIZE) {
                const oldestKey = chapterCache.keys().next().value;
                if (!oldestKey) {
                    break;
                }
                chapterCache.delete(oldestKey);
            }
        }

        async function ensureCbzChapterCache(chapter) {
            const cacheKey = getChapterCacheKey(chapter);
            if (!cacheKey) {
                throw new Error('无效的章节缓存键');
            }

            const existingCache = chapterCache.get(cacheKey);
            if (existingCache?.promise) {
                return existingCache.promise;
            }
            if (existingCache?.ready) {
                chapterCache.delete(cacheKey);
                chapterCache.set(cacheKey, existingCache);
                return existingCache;
            }

            const loadPromise = (async () => {
                const pagesUrl = `/api/comic-pages/${encodeURIComponent(comicName)}/${encodeURIComponent(chapter.filename)}`;
                let response;
                for (let attempt = 0; attempt < 3; attempt++) {
                    await waitForReaderVisible();
                    const controller = new AbortController();
                    const abortWhenHidden = () => { if (document.hidden) controller.abort(); };
                    const abortOnPageHide = () => controller.abort();
                    document.addEventListener('visibilitychange', abortWhenHidden);
                    window.addEventListener('pagehide', abortOnPageHide);
                    try {
                        response = await fetch(pagesUrl, { signal: controller.signal });
                    } catch (error) {
                        if (controller.signal.aborted) {
                            attempt--;
                            continue;
                        }
                        if (attempt === 2) throw error;
                        await new Promise((resolve) => window.setTimeout(resolve, 500));
                        continue;
                    } finally {
                        document.removeEventListener('visibilitychange', abortWhenHidden);
                        window.removeEventListener('pagehide', abortOnPageHide);
                    }
                    if (response.ok) break;
                    if (response.status < 500 || attempt === 2) throw new Error(`章节目录加载失败 (${response.status})`);
                    await new Promise((resolve) => window.setTimeout(resolve, 500));
                }
                const { pages, dimensions } = await response.json();
                const cacheEntry = {
                    ready: true,
                    pagesUrl,
                    images: Array.from({ length: pages }, (_, index) => index),
                    dimensions: Array.isArray(dimensions) ? dimensions : [],
                };

                chapterCache.set(cacheKey, cacheEntry);
                return cacheEntry;
            })().catch((error) => {
                chapterCache.delete(cacheKey);
                throw error;
            });

            chapterCache.set(cacheKey, { promise: loadPromise });
            return loadPromise;
        }

        function prefetchNextCbzChapter(chapterIndex) {
            const nextChapterIndex = chapterIndex + 1;
            if (nextChapterIndex >= chapters.length) {
                pruneChapterCache([getChapterCacheKey(chapters[chapterIndex])]);
                return;
            }

            const currentChapterMeta = chapters[chapterIndex];
            const nextChapterMeta = chapters[nextChapterIndex];
            const retainKeys = [getChapterCacheKey(currentChapterMeta)];

            if (!nextChapterMeta || nextChapterMeta.format !== 'cbz') {
                pruneChapterCache(retainKeys);
                return;
            }

            const nextCacheKey = getChapterCacheKey(nextChapterMeta);
            retainKeys.push(nextCacheKey);
            pruneChapterCache(retainKeys);

            const nextCache = chapterCache.get(nextCacheKey);
            if (nextCache?.ready || nextCache?.promise) {
                return;
            }

            scheduleIdleTask(() => {
                ensureCbzChapterCache(nextChapterMeta)
                    .then(() => pruneChapterCache(retainKeys))
                    .catch((error) => console.error('预取下一章失败:', error));
            });
        }
        
        function readerBackButtons() {
            return document.querySelectorAll('.back-btn');
        }

        function clearReaderBackPress(btn) {
            if (readerBackLeaving) return;
            btn.classList.remove('is-pressed');
        }

        function pressReaderBackButton(btn) {
            if (readerBackLeaving) return;
            btn.classList.add('is-pressed');
            if (readerBackPressTimer !== null) {
                window.clearTimeout(readerBackPressTimer);
            }
            readerBackPressTimer = window.setTimeout(() => {
                readerBackPressTimer = null;
                clearReaderBackPress(btn);
            }, 420);
        }

        function resetReaderBackButtons() {
            readerBackLeaving = false;
            if (readerBackPressTimer !== null) {
                window.clearTimeout(readerBackPressTimer);
                readerBackPressTimer = null;
            }
            readerBackButtons().forEach((btn) => {
                btn.classList.remove('is-pressed', 'is-leaving');
                btn.removeAttribute('aria-busy');
            });
        }

        function leaveReaderViaBackButton(btn) {
            if (readerBackLeaving) return false;
            readerBackLeaving = true;
            if (readerBackPressTimer !== null) {
                window.clearTimeout(readerBackPressTimer);
                readerBackPressTimer = null;
            }
            readerBackButtons().forEach((el) => {
                el.classList.add('is-leaving');
                el.classList.remove('is-pressed');
                el.setAttribute('aria-busy', 'true');
            });
            flushVisibleReadingTime();
            submitProgressSnapshot({ keepalive: true, includeReadingTime: true });
            const targetUrl = btn.getAttribute('href');
            window.requestAnimationFrame(() => {
                window.requestAnimationFrame(() => {
                    window.location.href = targetUrl;
                });
            });
            return true;
        }

        // 绑定所有事件
        function bindAllEvents() {
            readerBackButtons().forEach((btn) => {
                btn.addEventListener('pointerdown', () => pressReaderBackButton(btn));
                btn.addEventListener('pointercancel', () => clearReaderBackPress(btn));
                btn.addEventListener('pointerleave', () => clearReaderBackPress(btn));
                btn.addEventListener('click', (event) => {
                    event.preventDefault();
                    leaveReaderViaBackButton(btn);
                });
            });
            window.addEventListener('pageshow', resetReaderBackButtons);
            chapterSelectorBtn.addEventListener('click', toggleChapterSelector);
            document.getElementById('chapter-selector-close').addEventListener('click', hideChapterSelector);
            autoScrollBtn.addEventListener('click', toggleAutoScroll);
            document.getElementById('anilist-complete-btn')?.addEventListener('click', () => {
                reportCompletedChapter(currentChapter, true);
            });
            autoScrollSpeedSlider.addEventListener('input', handleAutoScrollSpeedChange);
            progressPrevBtn.addEventListener('click', goToPrevChapter);
            progressNextBtn.addEventListener('click', goToNextChapter);
            chapterSelect.addEventListener('change', handleChapterChange);
            widthAdjustBtn.addEventListener('click', toggleWidthSlider);
            widthSlider.addEventListener('input', handleWidthChange);
            readingProgressSlider.addEventListener('pointerdown', startProgressSliderDrag);
            readingProgressSlider.addEventListener('pointerup', stopProgressSliderDrag);
            readingProgressSlider.addEventListener('pointercancel', stopProgressSliderDrag);
            readingProgressSlider.addEventListener('input', handleProgressSliderInput);
            readingProgressSlider.addEventListener('change', finishProgressSliderDrag);

            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideChapterSelector();
                    return;
                }
                const target = e.target;
                if (e.defaultPrevented || e.isComposing || e.metaKey || e.ctrlKey || e.altKey ||
                    chapterSelector.style.display !== 'none' ||
                    (target instanceof Element && target.closest('input, select, textarea, button, a, [contenteditable], [role="slider"]'))) {
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    goToPrevChapter();
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    goToNextChapter();
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    toggleAutoScroll();
                }
            });

            // 点击切换工具栏
            screenClickTrigger.addEventListener('click', (e) => {
                if (chapterSelector.style.display === 'none') {
                    toggleToolbars();
                }
            });

            // 窗口大小变化
            window.addEventListener('resize', () => {
                const desktop = isDesktopViewport();
                if (desktop !== readerDesktopViewport) {
                    readerDesktopViewport = desktop;
                    if (currentChapterFormat !== null) {
                        savedScrollPosition = Math.max(window.scrollY - getChapterScrollBounds().start, 0);
                        loadChapter(currentChapter, true);
                    }
                }
                detectDevice();
                syncReadingProgressPlacement();
                queueProgressUiSync();
            });
        }
        
        // 切换工具栏显示/隐藏
        function toggleToolbars() {
            const isHidden = floatingControls.classList.contains('hidden');
            if (isHidden) {
                showToolbars();
            } else {
                floatingControls.classList.add('hidden');
                mobileHeader.classList.add('hidden');
                readingProgress.classList.add('hidden');
            }
        }

        // 显示工具栏
        function showToolbars() {
            floatingControls.classList.remove('hidden');
            mobileHeader.classList.remove('hidden');
            readingProgress.classList.remove('hidden');
        }
        
        // 切换宽度滑块显示
        function toggleWidthSlider() {
            const isActive = widthSliderContainer.classList.contains('active');
            if (isActive) {
                widthSliderContainer.classList.remove('active');
                widthAdjustBtn.classList.remove('margin-active');
            } else {
                widthSliderContainer.classList.add('active');
                widthAdjustBtn.classList.add('margin-active');
            }

        function syncAutoScrollSpeedUi() {
            autoScrollSpeedSlider.value = String(autoScrollSpeed);
            autoScrollSpeedValue.textContent = String(autoScrollSpeed);
        }

        function restoreAutoScrollSpeed() {
            try {
                const saved = Number(window.localStorage.getItem(AUTO_SCROLL_SPEED_STORAGE_KEY));
                if (Number.isInteger(saved) && saved >= 10 && saved <= 120 && saved % 5 === 0) {
                    autoScrollSpeed = saved;
                }
            } catch (error) {
                // 隐私模式或存储被禁用时继续使用默认速度。
            }
            syncAutoScrollSpeedUi();
        }

        function showAutoScrollSpeedControl() {
            autoScrollSpeedContainer.classList.add('active');
        }

        function hideAutoScrollSpeedControl() {
            autoScrollSpeedContainer.classList.remove('active');
        }

        function handleAutoScrollSpeedChange(e) {
            const speed = Number(e.target.value);
            if (!Number.isInteger(speed) || speed < 10 || speed > 120 || speed % 5 !== 0) return;
            autoScrollSpeed = speed;
            syncAutoScrollSpeedUi();
            try {
                window.localStorage.setItem(AUTO_SCROLL_SPEED_STORAGE_KEY, String(autoScrollSpeed));
            } catch (error) {
                // 存储不可用时，本次阅读仍可正常调速。
            }
        }

        // 处理宽度变化
        function handleWidthChange(e) {
            const marginValue = parseInt(e.target.value);
            setComicMargin(marginValue);

        // 设置漫画边距
        function setComicMargin(marginValue) {
            if (![0, 10, 20, 30, 40, 50, 60, 70].includes(marginValue)) return;

            currentMargin = marginValue;

            const pageContainers = document.querySelectorAll('.page-container');
            pageContainers.forEach(container => {
                container.classList.remove('margin-0', 'margin-10', 'margin-20', 'margin-30', 'margin-40', 'margin-50', 'margin-60', 'margin-70');
                container.classList.add(`margin-${marginValue}`);
            });

            // 更新显示的宽度值
            const widthPercent = 100 - marginValue;
            widthValue.textContent = `${widthPercent}%`;
            widthSlider.value = marginValue;
            queueProgressUiSync();
