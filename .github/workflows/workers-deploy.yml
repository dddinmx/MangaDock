name: Deploy Workers (free plan)
on:
  workflow_dispatch:
    inputs:
      complete_comic_id:
        description: Staging-only full-book completion and R2 integrity acceptance; requires diagnostic_task_id
        type: string
        required: false
      repair_storage_task_id:
        description: One-time staging repair of the old fatal upload-reservation conflict; exact existing task UUID
        type: string
        required: false
      repair_native_task_id:
        description: One-time staging repair of an existing native task stopped by old whole-chapter fallback
        type: string
        required: false
      diagnostic_task_id:
        description: Optional existing task ID for read-only staging diagnosis
        type: string
        required: false
      repair_cancelled_task:
        description: Audited cancelled-task counter repair JSON; no deployment or downloads
        type: string
        required: false
      queue_control:
        description: Only pause/resume queue delivery; skip tests, migration and deployment
        type: choice
        options: [none, pause, resume]
        default: none
      pause_queue_until_reset:
        description: Pause new queue sends until the next UTC day during deployment
        type: boolean
        default: false
      environment:
        type: choice
        description: Deployment environment
        options: [staging, production]
        default: staging
      source_book_id:
        description: Optional real Fanqie book ID (default 三国演义 first chapter)
        required: false
      test_novels:
        type: boolean
        description: Explicitly enable Fanqie registration and novel acceptance (API currently paused)
        default: false
      comic_chapters:
        type: choice
        description: Maximum real comic chapters to verify
        options: ["1", "2", "3"]
        default: "1"
      preflight_only:
        type: boolean
        description: Check CI credential readiness only; do not call Cloudflare or the database
        default: false
      verify_only:
        type: boolean
        description: Check the existing deployment without provisioning or deploying again
        default: false
      source_chapter_ids:
        description: Optional comma-separated real chapter IDs
        required: false
permissions:
  contents: read
  checks: write
concurrency:
  group: workers-${{ inputs.complete_comic_id && 'book-check' || inputs.verify_only && 'inspect-status' || 'rollout' }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.complete_comic_id && 300 || 30 }}
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: workers
    env:
      MANGADOCK_DB_DOWNLOAD_REQUESTS: "200000"
      MANGADOCK_DB_DOWNLOAD_STATEMENTS: "200000"
      MANGADOCK_DB_WEB_REQUESTS: ${{ inputs.environment != 'production' && '200000' || vars.MANGADOCK_DB_WEB_REQUESTS || vars.MANGADOCK_DB_DAILY_REQUESTS || '10000' }}
      MANGADOCK_DB_WEB_STATEMENTS: ${{ inputs.environment != 'production' && '200000' || vars.MANGADOCK_DB_WEB_STATEMENTS || vars.MANGADOCK_DB_DAILY_STATEMENTS || '50000' }}
      MANGADOCK_DB_DAILY_REQUESTS: ${{ vars.MANGADOCK_DB_DAILY_REQUESTS || '10000' }}
      MANGADOCK_DB_DAILY_STATEMENTS: ${{ vars.MANGADOCK_DB_DAILY_STATEMENTS || '50000' }}
      MANGADOCK_MAX_LIBRARY_BYTES: ${{ inputs.environment != 'production' && '9000000000' || vars.MANGADOCK_MAX_LIBRARY_BYTES }}
      DATABASE_PROVIDER: turso
      ENABLE_FANQIE_SOURCE: ${{ inputs.test_novels && 'true' || 'false' }}
      COMIC_MAX_CHAPTERS: ${{ inputs.comic_chapters || '1' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_TOKEN || secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MANGADOCK_ADMIN_PASSWORD: ${{ secrets.MANGADOCK_ADMIN_PASSWORD }}
      COMPUTE_WAKE_TOKEN: ${{ secrets.COMPUTE_WAKE_TOKEN }}
      FANQIE_API_TOKEN: ${{ secrets.FANQIE_API_TOKEN }}
      FANQIE_INSTANCE_ID: ${{ secrets.FANQIE_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Repair only audited cancelled-task counters
        if: ${{ inputs.repair_cancelled_task }}
        env:
          CANCEL_REPAIR_JSON: ${{ inputs.repair_cancelled_task }}
        run: |
          npm ci
          node scripts/repair-cancelled.mjs
      - name: Pause or resume queue delivery only
        if: ${{ inputs.queue_control && inputs.queue_control != 'none' }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
          QUEUE_CONTROL: ${{ inputs.queue_control }}
        run: python scripts/queue-delivery.py
      - name: Check configured secrets without exposing values
        run: |
          node --input-type=module - <<'JS'
          const required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','MANGADOCK_ADMIN_PASSWORD','COMPUTE_WAKE_TOKEN','TURSO_DATABASE_URL','TURSO_AUTH_TOKEN'];
          for (const key of required) console.log(key+': '+(process.env[key]?'configured':'missing'));
          const missing=required.filter(key=>!process.env[key]);
          if(missing.length)throw new Error('Missing CI Secrets: '+missing.join(', '));
          const wake=process.env.COMPUTE_WAKE_TOKEN;
          if(wake.length<32 || wake.length>4096 || /[\r\n]/.test(wake))throw new Error('COMPUTE_WAKE_TOKEN must be an independent value of at least 32 characters');
          JS
      - uses: actions/setup-python@v5
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') }}
        with:
          python-version: "3.12"
      - name: Install original-template reference dependencies
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') }}
        run: pip install Pillow==10.4.0 Jinja2==3.1.6 beautifulsoup4==4.12.3 requests==2.32.4
      - run: npm ci
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') }}
      - run: npm run verify
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only) }}
      - name: Provision and deploy without upgrading plan
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only) }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
          PAUSE_QUEUE_UNTIL_RESET: ${{ inputs.pause_queue_until_reset && 'true' || 'false' }}
        run: |
          if [ "$PAUSE_QUEUE_UNTIL_RESET" = "true" ]; then
            export MANGADOCK_QUEUE_PAUSE_UNTIL="$(node -e 'process.stdout.write(String((Math.floor(Date.now()/86400000)+1)*86400))')"
          fi
          npm run bootstrap -- "$DEPLOY_TARGET"
      - name: Resolve existing deployment without accessing D1
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (inputs.verify_only) }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFile} from 'node:fs/promises';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},signal:AbortSignal.timeout(15000)});
          const result=await response.json();
          if(!response.ok || !result.success)throw new Error('Cannot resolve deployed Worker URL');
          const name='mangadock-turso-'+process.env.DEPLOY_TARGET;
          await writeFile('deployment.json',JSON.stringify({url:`https://${name}.${result.result.subdomain}.workers.dev`,database_provider:'turso'}));
          JS
      - name: Measure deployed Turso login and library latency
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only) }}
        run: node scripts/latency-report.mjs
      - name: Deployed login, library and progress smoke test
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && inputs.test_novels) }}
        env:
          SOURCE_BOOK_ID: ${{ inputs.source_book_id || '6838936284967209991' }}
          SOURCE_CHAPTER_IDS: ${{ inputs.source_chapter_ids || (!inputs.source_book_id && '6838937005267616264') || '' }}
        run: npm run test:live
      - name: Read real-source EPUB in deployed browser and restore progress
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && inputs.test_novels) }}
        env:
          SOURCE_BOOK_ID: ${{ inputs.source_book_id || '6838936284967209991' }}
        run: node scripts/live-browser.mjs
      - name: Measure progress latency after the real-source test
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && !cancelled() && hashFiles('workers/deployment.json') != '') }}
        run: node scripts/latency-report.mjs
      - name: Run pending cloud conversions and original-model cover super-resolution
        id: cloud_compute
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && !cancelled() && hashFiles('workers/deployment.json') != '') }}
        run: |
          pip install -r scripts/cloud-compute-requirements.txt
          python scripts/cloud-compute.py --limit 10
      - name: Real comic source, private R2 pages and progress
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && !cancelled() && steps.cloud_compute.conclusion == 'success') }}
        run: node scripts/live-comic.mjs
      - name: Read real comic in the original browser reader and restore progress
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && success()) }}
        run: node scripts/live-comic-browser.mjs
      - name: Measure real comic progress latency
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && success()) }}
        run: node scripts/latency-report.mjs
      - name: Validate real task status, logs and execution times on desktop and mobile
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!inputs.verify_only && !cancelled() && hashFiles('workers/deployment.json') != '') }}
        run: node scripts/live-task-browser.mjs
      - name: Report real Cloudflare CPU (never treat wall time as CPU)
        if: ${{ !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && (!cancelled() && hashFiles('workers/deployment.json') != '') }}
        run: node scripts/cpu-report.mjs
      - name: Validate original deletion forms on isolated staging fixtures
        if: ${{ inputs.environment == 'staging' && !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') && !inputs.verify_only && success() }}
        run: node --experimental-strip-types scripts/live-delete-browser.mjs
      - name: Read staging update request logs and task records without starting downloads
        if: ${{ inputs.verify_only && inputs.environment == 'staging' && !inputs.preflight_only && !inputs.repair_cancelled_task && (!inputs.queue_control || inputs.queue_control == 'none') }}
        env:
          DIAGNOSTIC_TASK_ID: ${{ inputs.diagnostic_task_id }}
        run: node --experimental-strip-types scripts/update-diagnostics.mjs
      - name: Repair only the exact existing native fallback task
        if: ${{ inputs.environment == 'staging' && inputs.verify_only && inputs.repair_native_task_id && success() }}
        env:
          DEPLOY_TARGET: staging
          REPAIR_NATIVE_TASK_ID: ${{ inputs.repair_native_task_id }}
        run: node scripts/repair-native-fallback.mjs
      - name: Repair only the exact existing storage-conflict task
        if: ${{ inputs.environment == 'staging' && inputs.verify_only && inputs.repair_storage_task_id && success() }}
        env:
          DEPLOY_TARGET: staging
          REPAIR_NATIVE_MODE: storage
          REPAIR_NATIVE_TASK_ID: ${{ inputs.repair_storage_task_id }}
        run: node scripts/repair-native-fallback.mjs
      - name: Verify the complete existing comic, every R2 image and the last chapter reader
        if: ${{ inputs.environment == 'staging' && inputs.verify_only && inputs.complete_comic_id && success() }}
        env:
          COMPLETE_COMIC_ID: ${{ inputs.complete_comic_id }}
          DIAGNOSTIC_TASK_ID: ${{ inputs.diagnostic_task_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-complete-comic.mjs
      - name: Report actual CPU after whole-book validation
        if: ${{ inputs.environment == 'staging' && inputs.complete_comic_id && !cancelled() && hashFiles('workers/deployment.json') != '' }}
        run: node scripts/cpu-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ inputs.environment || 'staging' }}
          path: |
            workers/deployment.json
            workers/live-results.json
            workers/cpu-results.json
            workers/latency-results.json
            workers/live-browser-results.json
            workers/live-comic-results.json
            workers/live-comic-browser-results.json
            workers/live-task-results.json
            workers/live-delete-results.json
            workers/cancel-repair-results.json
            workers/update-diagnostics.json
            workers/complete-comic-results.json
            workers/test-results/live-task-*.png
            workers/test-results/task-waiting-*.png
            workers/test-results/live-comic-*.png
            workers/test-results/live-reader.png
            workers/test-results/parity-*.png
          if-no-files-found: ignore
