name: Deploy Workers (free plan)
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Deployment environment
        options: [staging, production]
        default: staging
      source_book_id:
        description: Optional real Fanqie book ID (default 三国演义 first chapter)
        required: false
      test_novels:
        type: boolean
        description: Explicitly enable Fanqie registration and novel acceptance (API currently paused)
        default: false
      comic_chapters:
        type: choice
        description: Maximum real comic chapters to verify
        options: ['1', '2']
        default: '1'
      verify_only:
        type: boolean
        description: Check the existing deployment without provisioning or deploying again
        default: false
      source_chapter_ids:
        description: Optional comma-separated real chapter IDs
        required: false
permissions:
  contents: read
concurrency:
  group: workers-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: workers
    env:
      MANGADOCK_DB_DAILY_REQUESTS: ${{ vars.MANGADOCK_DB_DAILY_REQUESTS || '10000' }}
      MANGADOCK_DB_DAILY_STATEMENTS: ${{ vars.MANGADOCK_DB_DAILY_STATEMENTS || '50000' }}
      DATABASE_PROVIDER: turso
      ENABLE_FANQIE_SOURCE: ${{ inputs.test_novels && 'true' || 'false' }}
      COMIC_MAX_CHAPTERS: ${{ inputs.comic_chapters || '1' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_TOKEN || secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MANGADOCK_ADMIN_PASSWORD: ${{ secrets.MANGADOCK_ADMIN_PASSWORD }}
      FANQIE_API_TOKEN: ${{ secrets.FANQIE_API_TOKEN }}
      FANQIE_INSTANCE_ID: ${{ secrets.FANQIE_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Check configured secrets
        run: |
          node --input-type=module -e "for (const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','MANGADOCK_ADMIN_PASSWORD','TURSO_DATABASE_URL','TURSO_AUTH_TOKEN']) if (!process.env[key]) throw new Error(key+' Secret is missing');"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-template reference dependencies
        run: pip install Pillow==10.4.0 Jinja2==3.1.6
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        if: ${{ !inputs.verify_only }}
      - name: Provision and deploy without upgrading plan
        if: ${{ !inputs.verify_only }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
        run: npm run bootstrap -- "$DEPLOY_TARGET"
      - name: Resolve existing deployment without accessing D1
        if: ${{ inputs.verify_only }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          node --input-type=module - <<'JS'
          import {writeFile} from 'node:fs/promises';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},signal:AbortSignal.timeout(15000)});
          const result=await response.json();
          if(!response.ok || !result.success)throw new Error('Cannot resolve deployed Worker URL');
          const name='mangadock-turso-'+process.env.DEPLOY_TARGET;
          await writeFile('deployment.json',JSON.stringify({url:`https://${name}.${result.result.subdomain}.workers.dev`,database_provider:'turso'}));
          JS
      - name: Measure deployed Turso login and library latency
        run: node scripts/latency-report.mjs
      - name: Deployed login, library and progress smoke test
        if: ${{ inputs.test_novels }}
        env:
          SOURCE_BOOK_ID: ${{ inputs.source_book_id || '6838936284967209991' }}
          SOURCE_CHAPTER_IDS: ${{ inputs.source_chapter_ids || (!inputs.source_book_id && '6838937005267616264') || '' }}
        run: npm run test:live
      - name: Read real-source EPUB in deployed browser and restore progress
        if: ${{ inputs.test_novels }}
        env:
          SOURCE_BOOK_ID: ${{ inputs.source_book_id || '6838936284967209991' }}
        run: node scripts/live-browser.mjs
      - name: Measure progress latency after the real-source test
        if: ${{ !cancelled() && hashFiles('workers/deployment.json') != '' }}
        run: node scripts/latency-report.mjs
      - name: Run pending cloud conversions and original-model cover super-resolution
        id: cloud_compute
        if: ${{ !cancelled() && hashFiles('workers/deployment.json') != '' }}
        run: |
          pip install -r scripts/cloud-compute-requirements.txt
          python scripts/cloud-compute.py --limit 10
      - name: Real comic source, private R2 pages and progress
        if: ${{ !cancelled() && steps.cloud_compute.conclusion == 'success' }}
        run: node scripts/live-comic.mjs
      - name: Read real comic in the original browser reader and restore progress
        if: ${{ success() }}
        run: node scripts/live-comic-browser.mjs
      - name: Measure real comic progress latency
        if: ${{ success() }}
        run: node scripts/latency-report.mjs
      - name: Report real Cloudflare CPU (never treat wall time as CPU)
        if: ${{ !cancelled() && hashFiles('workers/deployment.json') != '' }}
        run: node scripts/cpu-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ inputs.environment || 'staging' }}
          path: |
            workers/deployment.json
            workers/live-results.json
            workers/cpu-results.json
            workers/latency-results.json
            workers/live-browser-results.json
            workers/live-comic-results.json
            workers/live-comic-browser-results.json
            workers/test-results/live-comic-*.png
            workers/test-results/live-reader.png
            workers/test-results/parity-*.png
          if-no-files-found: ignore
