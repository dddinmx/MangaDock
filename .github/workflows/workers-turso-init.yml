name: Initialize Turso staging
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Deployment environment
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: turso-staging-initialization
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: workers
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_TOKEN || secrets.TURSO_AUTH_TOKEN }}
      MANGADOCK_ADMIN_PASSWORD: ${{ secrets.MANGADOCK_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:database
      - name: Initialize Turso schema and preserve existing administrator
        run: npm run database:init
