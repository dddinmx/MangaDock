name: Automatic bounded cloud conversions
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    concurrency:
      group: mangadock-auto-compute-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Probe DO-local pending flag without querying the database
        id: pending
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPUTE_WAKE_TOKEN: ${{ secrets.COMPUTE_WAKE_TOKEN }}
          DEPLOY_TARGET: ${{ matrix.target }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_TARGET: ${{ inputs.environment || 'staging' }}
          PRODUCTION_ENABLED: ${{ vars.MANGADOCK_PRODUCTION_COMPUTE_ENABLED || 'false' }}
        run: |
          python - <<'PY'
          import json,os,re,time,urllib.request,urllib.error
          def get(url,token):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'User-Agent':'MangaDock/5.0 Cloud-Compute'})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          target=os.environ['DEPLOY_TARGET']
          selected=(os.environ['EVENT_NAME']=='workflow_dispatch' and os.environ['REQUEST_TARGET']==target) or (os.environ['EVENT_NAME']!='workflow_dispatch' and (target=='staging' or os.environ['PRODUCTION_ENABLED']=='true'))
          if not selected:
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready=false\n')
              raise SystemExit(0)
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          wake=os.environ.get('COMPUTE_WAKE_TOKEN','')
          if len(wake)<32 or any(ch in wake for ch in '\r\n'):
              raise SystemExit('COMPUTE_WAKE_TOKEN secret is missing')
          print('::add-mask::'+wake)
          subdomain=get(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain',os.environ['CLOUDFLARE_API_TOKEN'])['result']['subdomain']
          url=f'https://mangadock-turso-{target}.{subdomain}.workers.dev'
          try:result=get(url+'/api/compute-ready',wake)['data']
          except urllib.error.HTTPError as error:
              if error.code in (404,503):result={'pending':False}
              else:raise
          resume_after=result.get('queue_resume_after',0)
          resume_ready=False
          if type(resume_after) in (int,float) and resume_after>0 and time.time()>=resume_after:
              queues=get(f'https://api.cloudflare.com/client/v4/accounts/{account}/queues?per_page=100',os.environ['CLOUDFLARE_API_TOKEN'])['result']
              resume_ready=any(queue['queue_name']=='mangadock-turso-'+target and queue.get('settings',{}).get('delivery_paused',False) for queue in queues)
          ready=result.get('pending',False)
          ref=str(result.get('ref',''))
          if (ready or resume_ready) and not re.fullmatch(r'(?:main|[a-f0-9]{40})',ref):
              raise ValueError('Deployed compute ref is not main or a commit SHA')
          sequence=result.get('sequence')
          if ready and (type(sequence) is not int or sequence<0):
              raise ValueError('Compute sequence is invalid')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready='+str(ready).lower()+'\nresume_ready='+str(resume_ready).lower()+'\n')
              if ready or resume_ready:out.write('ref='+ref+'\n')
          if ready:
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('MANGADOCK_URL='+url+'\nMANGADOCK_COMPUTE_SEQUENCE='+str(sequence)+'\n')
          PY
      - uses: actions/checkout@v4
        if: success() && (steps.pending.outputs.ready == 'true' || steps.pending.outputs.resume_ready == 'true')
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the deployed ref against main or an explicitly approved staging commit
        id: guard
        if: success() && (steps.pending.outputs.ready == 'true' || steps.pending.outputs.resume_ready == 'true')
        env:
          COMPUTE_REF: ${{ steps.pending.outputs.ref }}
          DEPLOY_TARGET: ${{ matrix.target }}
          APPROVED_COMPUTE_SHA: ${{ vars.MANGADOCK_APPROVED_COMPUTE_SHA || '2e2ad63cb1e1a4908ac0d58fe6ca4953fd2ad513' }}
        run: |
          set -euo pipefail
          ref="$COMPUTE_REF"
          printf '%s\n' "$ref" | grep -Eq '^(main|[a-f0-9]{40})$'
          git fetch --no-tags origin main
          target="$ref"
          if [ "$ref" = "main" ]; then target=origin/main; fi
          if ! git cat-file -e "$target^{commit}" 2>/dev/null; then git fetch --no-tags origin "$target"; fi
          if ! git merge-base --is-ancestor "$target" origin/main; then
            if [ "$DEPLOY_TARGET" != "staging" ] || [ "$target" != "$APPROVED_COMPUTE_SHA" ] || ! printf '%s\n' "$APPROVED_COMPUTE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
              echo "::error::Ref must be on main; staging may use the exact reviewed MANGADOCK_APPROVED_COMPUTE_SHA environment variable"
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        if: success() && steps.guard.outcome == 'success' && (steps.pending.outputs.ready == 'true' || steps.pending.outputs.resume_ready == 'true')
        with:
          ref: ${{ steps.pending.outputs.ref }}
          persist-credentials: false
      - name: Resume only the current queue after reset and reviewed-ref verification
        if: success() && steps.guard.outcome == 'success' && steps.pending.outputs.resume_ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: ${{ matrix.target }}
          QUEUE_CONTROL: resume
        run: python workers/scripts/queue-delivery.py
      - uses: actions/setup-python@v5
        if: success() && steps.guard.outcome == 'success' && steps.pending.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/scripts/cloud-compute-requirements.txt
      - name: Install conversion dependencies only when work exists
        if: success() && steps.guard.outcome == 'success' && steps.pending.outputs.ready == 'true'
        run: pip install -r workers/scripts/cloud-compute-requirements.txt
      - name: Run at most five jobs, with deadlines and lease fencing
        if: success() && steps.guard.outcome == 'success' && steps.pending.outputs.ready == 'true'
        env:
          MANGADOCK_ADMIN_PASSWORD: ${{ secrets.MANGADOCK_ADMIN_PASSWORD }}
          MANGADOCK_COMPUTE_TOKEN: ${{ secrets.COMPUTE_WAKE_TOKEN }}
        run: python workers/scripts/cloud-compute.py --scheduled --limit 5 --deadline 480
      - name: Release a failed launcher hold without acknowledging successful jobs
        if: failure() && steps.pending.outputs.ready == 'true'
        env:
          MANGADOCK_COMPUTE_TOKEN: ${{ secrets.COMPUTE_WAKE_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          data=json.dumps({'sequence':int(os.environ['MANGADOCK_COMPUTE_SEQUENCE']),'pending':True,'ok':False}).encode()
          request=urllib.request.Request(os.environ['MANGADOCK_URL']+'/api/compute-ready/finished',data=data,headers={'Authorization':'Bearer '+os.environ['MANGADOCK_COMPUTE_TOKEN'],'Content-Type':'application/json','User-Agent':'MangaDock/5.0 Cloud-Compute'})
          with urllib.request.urlopen(request,timeout=20) as response:response.read()
          PY
