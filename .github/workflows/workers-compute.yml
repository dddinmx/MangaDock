name: Cloud conversions and cover super-resolution
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      queue_control:
        description: Queue delivery control only; do not execute downloads
        type: choice
        options: [none, pause, resume]
        default: none
      limit:
        description: Maximum jobs in this run (1-20)
        default: "10"
permissions:
  contents: read
concurrency:
  group: workers-compute-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'staging' }}
    env:
      MANGADOCK_ADMIN_PASSWORD: ${{ secrets.MANGADOCK_ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve this account's deployed URL
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          request=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request) as response:subdomain=json.load(response)['result']['subdomain']
          name='mangadock-turso-'+os.environ['DEPLOY_TARGET']
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'MANGADOCK_URL=https://{name}.{subdomain}.workers.dev\n')
          PY
      - name: Pause or resume MangaDock queue delivery without running downloads
        if: ${{ inputs.queue_control && inputs.queue_control != 'none' }}
        env:
          DEPLOY_TARGET: ${{ inputs.environment || 'staging' }}
          QUEUE_CONTROL: ${{ inputs.queue_control }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          action=os.environ['QUEUE_CONTROL'];target=os.environ['DEPLOY_TARGET']
          if action not in ('pause','resume') or target not in ('staging','production'):raise ValueError('Invalid queue control')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          def call(path,method='GET',body=None):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:data=json.load(response)
              if not data.get('success'):raise RuntimeError('Queue control rejected')
              return data['result']
          changed=[]
          for page in range(1,101):
              queues=call('/queues?per_page=100&page='+str(page))
              for queue in queues:
                  name=queue['queue_name']
                  if not name.startswith('mangadock-') or not name.endswith('-'+target):continue
                  call('/queues/'+queue['queue_id'],'PATCH',{'queue_name':name,'settings':{'delivery_paused':action=='pause'}})
                  changed.append(name)
              if len(queues)<100:break
          if not changed:raise RuntimeError('No matching MangaDock queue')
          print(json.dumps({'action':action,'queues':changed}))
          PY
      - run: pip install -r workers/scripts/cloud-compute-requirements.txt
        if: ${{ !inputs.queue_control || inputs.queue_control == 'none' }}
      - name: Process bounded pending jobs
        if: ${{ !inputs.queue_control || inputs.queue_control == 'none' }}
        env:
          COMPUTE_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys
          limit = os.environ.get("COMPUTE_LIMIT", "")
          if not re.fullmatch(r"[1-9][0-9]?", limit) or not 1 <= int(limit) <= 20:
              sys.exit("limit must match ^[1-9][0-9]?$")
          PY
          python workers/scripts/cloud-compute.py --limit "$COMPUTE_LIMIT"
