name: cloudflare-worker

on:
  pull_request:
    paths: ["cloudflare/**", "static/**", "tools/cf/**", ".github/workflows/cloudflare.yml"]
  push:
    branches: [cf-workers-migration]
    tags: ["cf-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cf-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: cloudflare

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloudflare/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx wrangler types && npx tsc --noEmit
      - run: npx vitest run
      - name: Migration script tests
        working-directory: .
        run: python -m unittest tools/cf/test_migrate_to_cloudflare.py -v

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/cf-workers-migration' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloudflare/package-lock.json }
      - run: npm ci
      - run: ./scripts/prepare-assets.sh
      - run: npx wrangler d1 migrations apply DB --remote --env staging
      - run: npx wrangler deploy --env staging

  deploy-production:
    needs: test
    # Tag cf-vX.Y.Z or manual dispatch; the "production" GitHub environment should
    # have Required reviewers configured so this waits for manual approval.
    if: startsWith(github.ref, 'refs/tags/cf-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cloudflare/package-lock.json }
      - run: npm ci
      - run: ./scripts/prepare-assets.sh
      - run: npx wrangler d1 migrations apply DB --remote --env production
      - run: npx wrangler deploy --env production
